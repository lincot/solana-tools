[package]
name = "solana-tools"
version = "0.1.0"
edition = "2021"

[dependencies]
anchor-lang = "0.31.0"
base64 = "0.21"
bincode = "1.3.3"
env_logger = "0.11"
futures = "0.3.30"
log = "0.4.22"
serde = { version = "1.0", features = ["derive"] }
solana-address-lookup-table-interface = "3.1"
solana-client = "3.1"
solana-commitment-config = "3.1"
solana-compute-budget-interface = "3.0"
solana-sdk = "3.0"
solana-transaction-status = "3.1"
thiserror = "1.0"
tokio = { version = "1.36", features = ["sync"] }
url = "2.5.2"
uuid = { version = "1.10.0", features = ["v4"] }
